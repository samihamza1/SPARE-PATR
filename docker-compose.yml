# Local development database. Roles and grants are created by `pnpm db:bootstrap`,
# schema by `pnpm db:migrate` (see README / CLAUDE.md commands).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5432:5432'
    volumes:
      # postgres:18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
