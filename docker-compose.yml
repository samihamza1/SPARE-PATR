name: autoparts

services:
  postgres:
    image: postgres:18
    command: ['postgres', '-c', 'timezone=UTC']
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AUTOPARTS_OWNER_PASSWORD: ${AUTOPARTS_OWNER_PASSWORD:?set AUTOPARTS_OWNER_PASSWORD in .env}
      AUTOPARTS_APP_PASSWORD: ${AUTOPARTS_APP_PASSWORD:?set AUTOPARTS_APP_PASSWORD in .env}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the temporary init server only listens on the unix socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d autoparts']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
