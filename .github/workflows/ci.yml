name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - name: Existing migrations are unchanged
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          fi
          scripts/check-migrations-immutable.sh "$base"

  db:
    name: Migrations, RLS and API integration tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Throwaway credentials for the CI service container only.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      AUTOPARTS_OWNER_PASSWORD: ci_owner_pw
      AUTOPARTS_APP_PASSWORD: ci_app_pw
      DATABASE_URL: postgres://autoparts_owner:ci_owner_pw@localhost:5432/autoparts?sslmode=disable
      TEST_DATABASE_URL: postgres://autoparts_owner:ci_owner_pw@localhost:5432/autoparts_test?sslmode=disable
      TEST_APP_DATABASE_URL: postgres://autoparts_app:ci_app_pw@localhost:5432/autoparts_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create roles and databases
        run: db/bootstrap/00-roles.sh
      - run: pnpm db:migrate
      - name: Generated Kysely types match the schema
        run: pnpm --filter @autoparts/db codegen:check
      - run: pnpm test:db

  e2e:
    name: End-to-end (Playwright, PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Throwaway credentials for the CI service container only.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      AUTOPARTS_OWNER_PASSWORD: ci_owner_pw
      AUTOPARTS_APP_PASSWORD: ci_app_pw
      TEST_DATABASE_URL: postgres://autoparts_owner:ci_owner_pw@localhost:5432/autoparts_test?sslmode=disable
      TEST_APP_DATABASE_URL: postgres://autoparts_app:ci_app_pw@localhost:5432/autoparts_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create roles and databases
        run: db/bootstrap/00-roles.sh
      - name: Install Chromium for Playwright
        run: pnpm --filter @autoparts/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  perf:
    name: Search performance, 50k synthetic parts (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shared runners vary in speed: the result is reported, it does not block a merge.
    continue-on-error: true
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Throwaway credentials for the CI service container only.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      AUTOPARTS_OWNER_PASSWORD: ci_owner_pw
      AUTOPARTS_APP_PASSWORD: ci_app_pw
      TEST_DATABASE_URL: postgres://autoparts_owner:ci_owner_pw@localhost:5432/autoparts_test?sslmode=disable
      TEST_APP_DATABASE_URL: postgres://autoparts_app:ci_app_pw@localhost:5432/autoparts_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create roles and databases
        run: db/bootstrap/00-roles.sh
      - run: pnpm --filter @autoparts/api test:perf
