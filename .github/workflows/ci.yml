name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - name: Existing migrations are unchanged
        if: github.event_name == 'pull_request'
        run: scripts/check-migrations-immutable.sh "origin/${{ github.base_ref }}"

  db:
    name: Migrations and RLS tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Throwaway credentials for the CI service container only.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      AUTOPARTS_OWNER_PASSWORD: ci_owner_pw
      AUTOPARTS_APP_PASSWORD: ci_app_pw
      DATABASE_URL: postgres://autoparts_owner:ci_owner_pw@localhost:5432/autoparts?sslmode=disable
      TEST_DATABASE_URL: postgres://autoparts_owner:ci_owner_pw@localhost:5432/autoparts_test?sslmode=disable
      TEST_APP_DATABASE_URL: postgres://autoparts_app:ci_app_pw@localhost:5432/autoparts_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create roles and databases
        run: db/bootstrap/00-roles.sh
      - run: pnpm db:migrate
      - name: Generated Kysely types match the schema
        run: pnpm --filter @autoparts/db codegen:check
      - run: pnpm test:db
